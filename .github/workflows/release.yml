name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    name: Publish installers from verified main CI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag and versions
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag/version mismatch'
          assert json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'] == version
          assert re.search(r'^version = "([^"]+)"$', Path('src-tauri/Cargo.toml').read_text(), re.M)[1] == version
      - name: Require successful CI for this exact main commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo 'No successful main CI for this tag commit. Wait for CI, then rerun Release.' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run_id }}
          pattern: desktop-*
          path: downloaded
      - name: Collect and checksum installers
        shell: python
        run: |
          from pathlib import Path
          import hashlib, shutil
          source = Path('downloaded')
          output = Path('release-artifacts')
          output.mkdir()
          for platform in ['windows-x64', 'macos-universal', 'linux-x64']:
              assert (source / ('desktop-' + platform)).is_dir(), f'Missing platform: {platform}'
          files = sorted(p for p in source.rglob('*') if p.is_file())
          for p in files:
              if (output / p.name).exists():
                  raise RuntimeError(f'Duplicate artifact: {p.name}')
              shutil.copy2(p, output / p.name)
          for suffix in ['.exe', '.msi', '.dmg', '.deb', '.AppImage']:
              if not any(p.name.endswith(suffix) for p in files):
                  raise RuntimeError(f'Missing installer: {suffix}')
          sums = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(output.iterdir())]
          (output / 'SHA256SUMS.txt').write_text(''.join(sums), encoding='ascii')
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
          files: release-artifacts/*
