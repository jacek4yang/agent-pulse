name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: macos-universal
            os: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag and versions
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          if ((Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version -ne $version) { throw 'Tauri version mismatch' }
          if (!(Select-String -Path src-tauri/Cargo.toml -SimpleMatch "version = `"$version`"")) { throw 'Cargo version mismatch' }
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdotool libxdo-dev libfuse2 xvfb openbox xterm
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: src-tauri
      - run: cargo test --workspace --locked
        working-directory: src-tauri
      - name: Isolated Linux terminal Enter smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/linux-smoke.sh
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}"
        env:
          NO_STRIP: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: error
  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded
      - name: Collect and checksum installers
        shell: python
        run: |
          from pathlib import Path
          import hashlib, shutil
          source = Path('downloaded')
          output = Path('release-artifacts')
          output.mkdir()
          files = sorted(p for p in source.rglob('*') if p.is_file())
          for p in files:
              if (output / p.name).exists():
                  raise RuntimeError(f'Duplicate artifact: {p.name}')
              shutil.copy2(p, output / p.name)
          for suffix in ['.exe', '.msi', '.dmg', '.deb', '.AppImage']:
              if not any(p.name.endswith(suffix) for p in files):
                  raise RuntimeError(f'Missing installer: {suffix}')
          sums = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(output.iterdir())]
          (output / 'SHA256SUMS.txt').write_text(''.join(sums), encoding='ascii')
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
          files: release-artifacts/*
